                <h2>关闭烦人中文输入法ctrl+空格输入冲突</h2>
                <p style="font-size: 14px;">在很多游戏里，默认都没有默认使用中文输入法的情况下 ctrl疾跑 加空格 跳跃 会导致跳跃键失效</p>
                <p style="font-size: 14px;">所以我查阅了相关内容，发现是微软的bug，强制了一个无效快捷键，并且修改不了</p>
                <p style="font-size: 14px;">以下代码可以解除这个问题，请新建一个文本文件，并输入以下代码，另存为".reg"文件，并运行</p>

                <div class="editor-container">
                    <h3>取消ctrl+空格冲突.reg</h3>
                    <textarea id="code-editor">
Windows Registry Editor Version 5.00
                        
[HKEY_CURRENT_USER\Control Panel\Input Method\Hot Keys\00000010]
"Key Modifiers"=hex:00,c0,00,00
"Virtual Key"=hex:ff,00,00,00
                        
[HKEY_CURRENT_USER\Control Panel\Input Method\Hot Keys\00000070]
"Key Modifiers"=hex:00,c0,00,00
"Virtual Key"=hex:ff,00,00,00
                        
[HKEY_USERS\.DEFAULT\Control Panel\Input Method\Hot Keys\00000010]
"Key Modifiers"=hex:02,c0,00,00
"Target IME"=hex:00,00,00,00
"Virtual Key"=hex:ff,00,00,00
                        
[HKEY_USERS\.DEFAULT\Control Panel\Input Method\Hot Keys\00000070]
"Key Modifiers"=hex:02,c0,00,00
"Target IME"=hex:00,00,00,00
"Virtual Key"=hex:ff,00,00,00
                    </textarea>
                </div>
                <br />
                <p style="font-size: 14px;">然后你可以打开 设置 &gt; 时间与语言 &gt; 输入 &gt; 高级输入设置 &gt; 语言栏选项 中最后一个选项就是</p>
                <br />
                <img src="../img/yuyan.png" class="zusing">
            </div>
