    <script>
        function copyIp() {
            const ip = "play.ncxiaoyi.cn";
            navigator.clipboard.writeText(ip).then(() => {
                alert("IP 地址已复制： " + ip);
            }).catch(err => {
                alert("复制失败，请手动复制： " + ip);
            });
        }
        function copyqun() {
            const qun = "655908859";
            navigator.clipboard.writeText(qun).then(() => {
                alert("群号已复制：" + qun);
            }).catch(err => {
                alert("复制失败");
            });
        }

        function fetchPlayerCount() {
            fetch("https://list.mczfw.cn/api/play.ncxiaoyi.cn")
                .then(response => response.json())
                .then(data => {
                    const playerCount = data.p || "无法获取";
                    const maxPlayers = data.mp || "未知";
                    const logo = data.logo;

                    document.getElementById("playerCount").textContent = playerCount + " / " + maxPlayers;
                    if (logo) {
                        document.getElementById("serverLogo").src = logo;
                    }
                })
                .catch(() => {
                    document.getElementById("playerCount").textContent = "无法获取";
                });
        }

        window.onload = fetchPlayerCount;
    </script>
