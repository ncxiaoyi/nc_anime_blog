<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级音乐播放器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-image 0.5s ease-in-out;
        }

        .player {
            width: 400px;
            position: relative;
            text-align: center;
            border-radius: 20px;
            overflow: hidden;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-size: cover;
            background-position: center;
            filter: blur(80px) brightness(0.7);
            transform: scaleY(-1);
            z-index: -1;
        }

        .cover {
            width: 80%;
            margin: 20px auto 0 auto;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            /* transition: transform 0.8s ease-in-out; */
            /* 加长过渡时间 */
        }

        .cover img {
            width: 100%;
            border-radius: 15px;
            object-fit: cover;
        }

        .info {
            /* margin: 15px 0; */
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0;
            color: #000000;
        }

        .artist {
            font-size: 14px;
            color: #373737;
        }

        .progress-container {
            position: relative;
            margin: 20px auto;
            width: 90%;
            height: 8px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5));
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: height 0.2s ease-in-out;
        }

        .progress-container:hover {
            height: 14px;
        }

        #progress {
            appearance: none;
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
        }

        #progress::-webkit-slider-thumb {
            appearance: none;
            width: 0;
            height: 0;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgb(255, 192, 215, 0.8);
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 148, 164, 0.8);
            /* margin: 5px 20px; */
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            /* margin: 20px 0; */
        }

        .control-btn {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border: none;
            background: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-btn img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .control-btn:hover img {
            transform: scale(1.2);
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0px auto;
            width: 90%;
        }

        #volume {
            appearance: none;
            width: 80%;
            height: 8px;
            background: linear-gradient(to right, rgba(255, 148, 164, 0.8), rgba(255, 255, 255, 0.2));
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: height 0.2s ease-in-out;
        }

        #volume:hover {
            height: 14px;
        }

        #volume::-webkit-slider-thumb {
            appearance: none;
            width: 0;
            height: 0;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="player">
        <div class="background" id="background"></div>
        <div class="cover">
            <img id="cover-image" src="" alt="封面">
        </div>
        <div class="info">
            <h3 class="title" id="song-title">甜味夏天</h3>
            <p class="artist" id="song-artist">歌手名字</p>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
            <input type="range" id="progress" min="0" max="100" value="0">
        </div>
        <div class="progress-time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="controls">
            <button id="prev" class="control-btn">
                <img src="./mp3/2.png" alt="上一首">
            </button>
            <button id="play-pause" class="control-btn">
                <img id="play-pause-img" src="./mp3/0.png" alt="播放">
            </button>
            <button id="next" class="control-btn">
                <img src="./mp3/1.png" alt="下一首">
            </button>
        </div>

        <div class="volume-container">
            <img class="volume-icon" src="./mp3/5.png" alt="下一首">
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
            <img class="volume-icon" src="./mp3/4.png" alt="下一首">
        </div>
    </div>

    <audio id="audio">
        <source id="audio-source" src="./mp3/甜味夏天.mp3" type="audio/mp3">
    </audio>

    <script>
        // 歌曲列表
        const songs = [
            {
                title: "甜味夏天",
                artist: "逆时针向/ 忘乡",
                audioUrl: "mp3/甜味夏天.mp3",
                coverImage: "mp3/甜味夏天.jpg"
            },
            {
                title: "裙摆舞动飘逸，踏出旋律涟漪的倒影",
                artist: "Wthegg",
                audioUrl: "mp3/裙摆舞动飘逸，踏出旋律涟漪的倒影 - Wthegg.mp3",
                coverImage: "mp3/裙摆舞动飘逸，踏出旋律涟漪的倒影 - Wthegg.jpg"
            },
            {
                title: "リテラチュア",
                artist: "上田麗奈",
                audioUrl: "mp3/リテラチュア.mp3",
                coverImage: "mp3/リテラチュア.jpg"
            },
            {
                title: "優しさの記憶",
                artist: "鹿乃",
                audioUrl: "mp3/優しさの記憶 (温情的回忆) - 鹿乃.mp3",
                coverImage: "mp3/優しさの記憶 (温情的回忆) - 鹿乃.jpg"
            },
            {
                title: "宙でおやすみ",
                artist: "Aiobahn _ 長瀬有花",
                audioUrl: "mp3/宙でおやすみ (在天空晚安) - Aiobahn _ 長瀬有花.mp3",
                coverImage: "mp3/宙でおやすみ (在天空晚安) - Aiobahn _ 長瀬有花.jpg"
            },
            {
                title: "Alice in 冷凍庫",
                artist: "Orangestar",
                audioUrl: "mp3/Alice in 冷凍庫 (Alince in 冷冻库) - Orangestar.mp3",
                coverImage: "mp3/Alice in 冷凍庫 (Alince in 冷冻库) - Orangestar.jpg"
            }
        ];

        // 当前歌曲索引
        let currentSongIndex = 0;

        // 获取相关元素
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const audioSource = document.getElementById('audio-source');
        const coverImage = document.getElementById('cover-image');
        const background = document.getElementById('background');
        const audio = document.getElementById('audio');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeDisplay = document.getElementById('current-time');
        const durationDisplay = document.getElementById('duration');

        // 更新播放器信息
        function updatePlayer(song) {
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            audioSource.src = song.audioUrl;
            coverImage.src = song.coverImage;
            audio.load(); // 重新加载音频
            audio.play(); // 自动播放新歌曲

            // 添加平滑滑动动画
            coverImage.parentElement.style.transition = 'transform 0.8s ease-in-out'; // 设置更平滑的过渡时间
            // coverImage.parentElement.style.transform = 'translateX(-100%)'; // 向左滑动
            setTimeout(() => {
                coverImage.parentElement.style.transition = 'none'; // 暂时关闭过渡
                coverImage.parentElement.style.transform = 'translateX(0)'; // 恢复位置
                setTimeout(() => {
                    coverImage.parentElement.style.transition = 'transform 0.8s ease-in-out'; // 恢复过渡效果
                }, 50); // 恢复过渡效果
            }, 800); // 动画持续时间
        }


        // 播放/暂停功能
        let isPlaying = false;
        const playPauseBtn = document.getElementById('play-pause');
        playPauseBtn.addEventListener('click', () => {
            const playPauseImg = document.getElementById('play-pause-img');
            if (isPlaying) {
                audio.pause();
                playPauseImg.src = './mp3/0.png'; // 切换为播放图片
            } else {
                audio.play();
                playPauseImg.src = './mp3/3.png'; // 切换为暂停图片
            }
            isPlaying = !isPlaying;
        });

        // 下一首按钮
        document.getElementById('next').addEventListener('click', function () {
            currentSongIndex = (currentSongIndex + 1) % songs.length; // 循环播放
            updatePlayer(songs[currentSongIndex]);
        });

        // 上一首按钮
        document.getElementById('prev').addEventListener('click', function () {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; // 循环播放
            updatePlayer(songs[currentSongIndex]);
        });

        // 监听音频播放进度
        audio.addEventListener("timeupdate", () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration;

            // 只有当 `duration` 不是 NaN 时才更新进度条
            if (!isNaN(duration)) {
                const progressValue = (currentTime / duration) * 100;
                progress.value = progressValue;
                progressBar.style.width = `${progressValue}%`;

                currentTimeDisplay.textContent = formatTime(currentTime);
                durationDisplay.textContent = formatTime(duration);
            }
        });

        // 修正格式化时间函数，避免 NaN:NaN
        const formatTime = (time) => {
            if (isNaN(time) || time === Infinity) return "0:00"; // 避免 NaN
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        };

        // 进度条拖动时更新播放进度
        progress.addEventListener('input', () => {
            const progressValue = progress.value;
            audio.currentTime = (progressValue / 100) * audio.duration;
        });

        // 设置初始歌曲
        updatePlayer(songs[currentSongIndex]);

        volume.addEventListener('input', () => {
            audio.volume = volume.value;
            const volumeValue = volume.value * 100; // 0-100
            volume.style.background = `linear-gradient(to right, rgb(255, 192, 215, 0.8) ${volumeValue}%, rgba(255, 255, 255, 0.5) ${volumeValue}%)`;
        });

        volume.dispatchEvent(new Event('input')); // 初始化音量条背景

        function checkScreenSize() {
            // 获取屏幕宽度和高度
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 检查宽度和高度
            if (width > 400 && height > 550) {
                // 设置背景图片
                document.body.style.backgroundImage = "url('background.jpg')";
            } else {
                // 如果不满足条件，移除背景图片
                document.body.style.backgroundImage = "";
            }
        }

        // 页面加载时检查屏幕大小
        window.onload = checkScreenSize;

        // 每当窗口大小发生变化时，重新检查
        window.onresize = checkScreenSize;

        // 监听音频播放，确保图标状态同步
        audio.addEventListener("play", () => {
            isPlaying = true;
            document.getElementById("play-pause-img").src = "./mp3/3.png"; // 切换为暂停图标
        });

        // 监听音频暂停，确保图标状态同步
        audio.addEventListener("pause", () => {
            isPlaying = false;
            document.getElementById("play-pause-img").src = "./mp3/0.png"; // 切换为播放图标
        });

        // 监听歌曲播放结束，自动切换到下一首
        audio.addEventListener("ended", () => {
            currentSongIndex = (currentSongIndex + 1) % songs.length; // 计算下一首歌曲索引
            updatePlayer(songs[currentSongIndex]); // 更新播放器并播放
        });

    </script>
</body>

</html>
